name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      ACOUSTID_API_KEY: ${{ secrets.ACOUSTID_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore shared signing key
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > androidApp/debug.keystore

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test and build APK
        run: ./gradlew :shared:testAndroidHostTest :androidApp:assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: janeway-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 7

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk "janeway-${GITHUB_REF_NAME}.apk"
          # A moved tag reuses its release and replaces the APK.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "janeway-${GITHUB_REF_NAME}.apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "janeway-${GITHUB_REF_NAME}.apk" --generate-notes
          fi
